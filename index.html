<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRewards - Vitória</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .active-tab { color: #ef4444; border-bottom: 2px solid #ef4444; }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop { 0% { transform: scale(0.95); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-gradient-to-r from-rose-500 to-red-600 p-6 text-white rounded-b-[2.5rem] shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <h1 class="text-2xl font-black tracking-tight italic">Olá, Vitória!</h1>
                <p class="text-[10px] opacity-80 font-bold uppercase tracking-widest">Sua jornada fitness</p>
            </div>
            <div class="bg-white/20 backdrop-blur-md p-3 rounded-2xl text-center min-w-[100px] border border-white/10">
                <p class="text-[9px] uppercase font-black tracking-tighter opacity-70">Saldo Atual</p>
                <p class="text-2xl font-black" id="balance-display">500</p>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-5 space-y-6">

        <!-- ABA: FEED (DIÁRIO) -->
        <section id="tab-feed" class="tab-content">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest">Registros do dia</h2>
                <button onclick="toggleModal('modal-checkin')" class="bg-rose-500 text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow-lg shadow-rose-200 active:scale-95 transition">
                    <i class="fas fa-plus mr-1"></i> NOVO
                </button>
            </div>
            <div id="feed-list" class="space-y-4">
                <!-- Posts injetados via JS -->
            </div>
        </section>

        <!-- ABA: METAS -->
        <section id="tab-metas" class="tab-content hidden">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-5">Tabela de Pontos 📊</h2>
            <div id="metas-list" class="space-y-3"></div>
        </section>

        <!-- ABA: LOJA -->
        <section id="tab-shop" class="tab-content hidden">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-5">Prêmios 🎁</h2>
            <div id="shop-list" class="grid grid-cols-2 gap-4"></div>
        </section>

        <!-- ABA: ADMIN -->
        <section id="tab-admin" class="tab-content hidden">
            <div id="admin-login" class="text-center py-10 space-y-4">
                <div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center mx-auto text-slate-400">
                    <i class="fas fa-lock text-2xl"></i>
                </div>
                <h2 class="text-lg font-bold">Acesso Restrito</h2>
                <input id="admin-pass" type="password" placeholder="Senha" class="w-full p-4 rounded-2xl border text-center outline-none focus:border-rose-500 transition-all">
                <button onclick="checkAdmin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold shadow-xl">Entrar</button>
            </div>
            
            <div id="admin-panel" class="hidden space-y-8 animate-pop">
                <!-- Add Metas -->
                <div class="bg-white p-6 rounded-3xl card-shadow border border-slate-100">
                    <h3 class="font-black text-xs text-rose-500 uppercase mb-4">Gerenciar Metas</h3>
                    <div class="space-y-3">
                        <input id="new-meta-name" placeholder="Nome (Ex: Treino)" class="w-full p-3 bg-slate-50 rounded-xl text-sm outline-none">
                        <input id="new-meta-points" type="number" placeholder="Pontos (Ex: 10)" class="w-full p-3 bg-slate-50 rounded-xl text-sm outline-none">
                        <button onclick="addMeta()" class="w-full bg-rose-500 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-md">Adicionar Meta</button>
                    </div>
                </div>

                <!-- Add Loja -->
                <div class="bg-white p-6 rounded-3xl card-shadow border border-slate-100">
                    <h3 class="font-black text-xs text-blue-500 uppercase mb-4">Gerenciar Loja</h3>
                    <div class="space-y-3">
                        <input id="new-item-name" placeholder="Nome do Prêmio" class="w-full p-3 bg-slate-50 rounded-xl text-sm outline-none">
                        <input id="new-item-price" type="number" placeholder="Preço (Pts)" class="w-full p-3 bg-slate-50 rounded-xl text-sm outline-none">
                        <input id="new-item-img" placeholder="URL da Imagem (Opcional)" class="w-full p-3 bg-slate-50 rounded-xl text-sm outline-none">
                        <button onclick="addItem()" class="w-full bg-blue-500 text-white py-3 rounded-xl font-bold text-xs uppercase shadow-md">Adicionar Item</button>
                    </div>
                </div>

                <button onclick="resetApp()" class="w-full text-slate-300 text-[10px] font-bold uppercase tracking-widest pt-5">Limpar Tudo (Reset)</button>
            </div>
        </section>

    </main>

    <!-- Menu Navegação -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-100 p-4 flex justify-around items-center max-w-md mx-auto rounded-t-[2rem] shadow-2xl z-50">
        <button onclick="switchTab('feed')" class="nav-btn flex flex-col items-center active-tab" id="nav-feed">
            <i class="fas fa-fire-alt text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Feed</span>
        </button>
        <button onclick="switchTab('metas')" class="nav-btn flex flex-col items-center text-slate-400" id="nav-metas">
            <i class="fas fa-tasks text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Metas</span>
        </button>
        <button onclick="switchTab('shop')" class="nav-btn flex flex-col items-center text-slate-400" id="nav-shop">
            <i class="fas fa-shopping-bag text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Loja</span>
        </button>
        <button onclick="switchTab('admin')" class="nav-btn flex flex-col items-center text-slate-400" id="nav-admin">
            <i class="fas fa-cog text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Painel</span>
        </button>
    </nav>

    <!-- Modal Novo Check-in -->
    <div id="modal-checkin" class="fixed inset-0 bg-black/60 hidden z-[60] flex items-end justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-[3rem] p-8 space-y-5 mb-20 shadow-2xl animate-pop">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-black italic uppercase italic">Novo Check-in</h3>
                <button onclick="toggleModal('modal-checkin')" class="text-slate-300 text-2xl"><i class="fas fa-times-circle"></i></button>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">O que você concluiu?</label>
                <select id="checkin-activity" class="w-full p-4 bg-slate-50 rounded-2xl mt-1 outline-none font-bold text-sm border-none shadow-inner"></select>
            </div>
            <button onclick="submitCheckin()" class="w-full py-5 bg-rose-500 text-white rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-rose-100 active:scale-95 transition">Confirmar e Ganhar</button>
        </div>
    </div>

    <script>
        // Dados Padrão (Usados no primeiro acesso)
        const DEFAULT_METAS = [
            { id: 1, nome: "Musculação", pontos: 5 }, { id: 2, nome: "Cardio (30 min)", pontos: 5 },
            { id: 3, nome: "Beber 2L de Água", pontos: 5 }, { id: 4, nome: "Cirurgia Joelho", pontos: 3000 }
        ];

        const DEFAULT_LOJA = [
            { id: 1, nome: "Jantar Especial", preco: 1600, img: "https://images.unsplash.com/photo-1559339352-11d035aa65de?w=400" },
            { id: 2, nome: "Vale R$500 Shein", preco: 3000, img: "https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400" }
        ];

        // Estado do Aplicativo
        let state = JSON.parse(localStorage.getItem('fit_vitoria_v3')) || {
            balance: 500, // Começa com 500 pontos
            checkins: [],
            metas: DEFAULT_METAS,
            loja: DEFAULT_LOJA
        };

        function save() { 
            localStorage.setItem('fit_vitoria_v3', JSON.stringify(state)); 
            render(); 
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab', 'text-slate-400'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('active-tab');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === '271224') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else { alert("Senha Admin incorreta!"); }
        }

        // LÓGICA DE FUNCIONAMENTO
        function submitCheckin() {
            const select = document.getElementById('checkin-activity');
            const meta = state.metas.find(m => m.nome === select.value);
            if(!meta) return;

            const checkin = {
                id: Date.now(),
                activity: meta.nome,
                points: meta.pontos,
                date: new Date().toLocaleDateString('pt-BR'),
                time: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
            };

            state.checkins.unshift(checkin);
            state.balance += meta.pontos; // Adiciona os pontos na hora
            toggleModal('modal-checkin');
            save();
        }

        function addMeta() {
            const nome = document.getElementById('new-meta-name').value;
            const pontos = parseInt(document.getElementById('new-meta-points').value);
            if(nome && pontos) {
                state.metas.push({ id: Date.now(), nome, pontos });
                document.getElementById('new-meta-name').value = '';
                document.getElementById('new-meta-points').value = '';
                save();
            }
        }

        function deleteMeta(id) {
            if(confirm("Excluir esta meta permanentemente?")) {
                state.metas = state.metas.filter(m => m.id !== id);
                save();
            }
        }

        function addItem() {
            const nome = document.getElementById('new-item-name').value;
            const preco = parseInt(document.getElementById('new-item-price').value);
            const img = document.getElementById('new-item-img').value || "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400";
            if(nome && preco) {
                state.loja.push({ id: Date.now(), nome, preco, img });
                document.getElementById('new-item-name').value = '';
                document.getElementById('new-item-price').value = '';
                document.getElementById('new-item-img').value = '';
                save();
            }
        }

        function deleteItem(id) {
            if(confirm("Excluir este item da loja?")) {
                state.loja = state.loja.filter(i => i.id !== id);
                save();
            }
        }

        function deleteCheckin(id) {
            if(confirm("Remover este registro do diário?")) {
                state.checkins = state.checkins.filter(c => c.id !== id);
                save();
            }
        }

        // RENDERIZAÇÃO DA INTERFACE
        function render() {
            document.getElementById('balance-display').innerText = state.balance;
            
            // Render Diário (Feed)
            const feed = document.getElementById('feed-list');
            feed.innerHTML = state.checkins.map(c => `
                <div class="bg-white p-5 rounded-[2rem] card-shadow border border-slate-50 relative animate-pop">
                    <button onclick="deleteCheckin(${c.id})" class="absolute top-4 right-5 text-slate-200 hover:text-rose-500"><i class="fas fa-trash-alt text-xs"></i></button>
                    <span class="text-[9px] font-black text-slate-300 uppercase">${c.date} • ${c.time}</span>
                    <h3 class="font-black text-slate-800 uppercase italic leading-none mt-1">${c.activity}</h3>
                    <div class="mt-4 pt-3 border-t border-slate-50 flex items-center text-emerald-500 font-black text-[10px]">
                        <i class="fas fa-check-circle mr-1"></i> +${c.points} PONTOS VALIDADOS
                    </div>
                </div>
            `).join('') || '<p class="text-center text-slate-300 py-10 text-xs">Nada registrado hoje ainda.</p>';

            // Render Metas
            const metasUI = document.getElementById('metas-list');
            const isAdmin = !document.getElementById('admin-panel').classList.contains('hidden');
            metasUI.innerHTML = state.metas.map(m => `
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl card-shadow border border-slate-50">
                    <div class="flex flex-col">
                        <span class="font-bold text-slate-700 text-xs uppercase">${m.nome}</span>
                        <span class="text-rose-500 font-black text-[10px]">+${m.pontos} Pts</span>
                    </div>
                    ${isAdmin ? `<button onclick="deleteMeta(${m.id})" class="text-rose-300 hover:text-rose-600 transition p-2"><i class="fas fa-trash-alt"></i></button>` : '<i class="fas fa-award text-slate-100"></i>'}
                </div>
            `).join('');

            // Render Loja
            document.getElementById('shop-list').innerHTML = state.loja.map(i => `
                <div class="bg-white p-3 rounded-[2rem] card-shadow flex flex-col h-full relative animate-pop">
                    ${isAdmin ? `<button onclick="deleteItem(${i.id})" class="absolute top-2 right-2 bg-white/90 w-8 h-8 rounded-full text-rose-500 shadow-sm z-10"><i class="fas fa-trash-alt text-[10px]"></i></button>` : ''}
                    <img src="${i.img}" class="w-full h-24 object-cover rounded-[1.5rem] mb-3">
                    <h4 class="text-[10px] font-black text-slate-800 uppercase px-1 flex-grow">${i.nome}</h4>
                    <div class="mt-3 p-2 bg-slate-50 rounded-xl flex items-center justify-between">
                        <span class="text-rose-600 font-black text-[10px]">${i.preco} pts</span>
                        <button class="bg-slate-900 text-white p-1.5 rounded-lg text-[8px] font-bold uppercase">Resgatar</button>
                    </div>
                </div>
            `).join('');

            // Modal Select
            const sel = document.getElementById('checkin-activity');
            sel.innerHTML = state.metas.map(m => `<option value="${m.nome}">${m.nome} (+${m.pontos} pts)</option>`).join('');
        }

        function resetApp() { if(confirm("Atenção: Isso apagará todos os seus pontos e registros. Confirmar?")) { localStorage.clear(); location.reload(); } }

        render();
    </script>
</body>
</html>
