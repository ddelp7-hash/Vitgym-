<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitRewards - Vitória</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .active-tab { color: #ef4444; border-bottom: 2px solid #ef4444; }
        .card-shadow { box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header com Saldo -->
    <div class="bg-gradient-to-r from-rose-500 to-red-600 p-6 text-white rounded-b-[2.5rem] shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div>
                <p class="text-xs opacity-90 uppercase font-bold tracking-widest">Olá, Vitória! 💪</p>
                <h1 class="text-2xl font-black italic">FITREWARDS</h1>
            </div>
            <div class="bg-white/20 backdrop-blur-md p-3 rounded-2xl text-center min-w-[110px] border border-white/10">
                <p class="text-[10px] uppercase font-bold tracking-tighter">Meu Saldo</p>
                <p class="text-2xl font-black" id="balance-display">0</p>
            </div>
        </div>
    </div>

    <!-- Conteúdo -->
    <main class="max-w-md mx-auto p-5 space-y-6">

        <!-- ABA: FEED (Check-ins) -->
        <section id="tab-feed" class="tab-content">
            <div class="flex justify-between items-center mb-5">
                <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest">Diário de Treino</h2>
                <button onclick="toggleModal('modal-checkin')" class="bg-rose-500 text-white px-5 py-2.5 rounded-2xl text-xs font-black shadow-lg shadow-rose-200 active:scale-95 transition">
                    <i class="fas fa-plus mr-1"></i> NOVO
                </button>
            </div>
            <div id="feed-list" class="space-y-4">
                <!-- Os posts aparecerão aqui via JS -->
            </div>
        </section>

        <!-- ABA: TABELA DE PONTOS -->
        <section id="tab-metas" class="tab-content hidden">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-5">Como ganhar pontos 📊</h2>
            <div id="metas-list" class="space-y-3"></div>
        </section>

        <!-- ABA: LOJA DE PRÊMIOS -->
        <section id="tab-shop" class="tab-content hidden">
            <h2 class="text-sm font-black text-slate-400 uppercase tracking-widest mb-5">Mimos & Recompensas 🎁</h2>
            <div id="shop-list" class="grid grid-cols-2 gap-4"></div>
        </section>

        <!-- ABA: ADMIN (PROTEGIDA) -->
        <section id="tab-admin" class="tab-content hidden">
            <div id="admin-login" class="text-center py-10 space-y-4">
                <i class="fas fa-lock text-4xl text-slate-200"></i>
                <h2 class="text-lg font-bold">Acesso Restrito</h2>
                <input id="admin-pass" type="password" placeholder="Senha do Admin" class="w-full p-4 rounded-2xl border text-center outline-none focus:border-rose-500">
                <button onclick="checkAdmin()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold">Entrar</button>
            </div>
            
            <div id="admin-panel" class="hidden space-y-6">
                <div class="bg-white p-5 rounded-3xl border border-amber-100 shadow-sm">
                    <h3 class="font-black text-xs text-amber-600 uppercase mb-4">Aprovações Pendentes</h3>
                    <div id="admin-approvals" class="space-y-3"></div>
                </div>
                <button onclick="resetApp()" class="w-full text-slate-300 text-[10px] font-bold uppercase tracking-widest pt-10">Resetar Aplicativo</button>
            </div>
        </section>

    </main>

    <!-- Menu de Navegação -->
    <nav class="fixed bottom-0 left-0 right-0 glass border-t border-slate-100 p-4 flex justify-around items-center max-w-md mx-auto rounded-t-[2.5rem] shadow-2xl">
        <button onclick="switchTab('feed')" class="nav-btn flex flex-col items-center active-tab" id="nav-feed">
            <i class="fas fa-fire text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Feed</span>
        </button>
        <button onclick="switchTab('metas')" class="nav-btn flex flex-col items-center text-slate-400" id="nav-metas">
            <i class="fas fa-list-check text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Metas</span>
        </button>
        <button onclick="switchTab('shop')" class="nav-btn flex flex-col items-center text-slate-400" id="nav-shop">
            <i class="fas fa-gift text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Loja</span>
        </button>
        <button onclick="switchTab('admin')" class="nav-btn flex flex-col items-center text-slate-400" id="nav-admin">
            <i class="fas fa-user-shield text-xl"></i>
            <span class="text-[9px] font-bold uppercase mt-1">Admin</span>
        </button>
    </nav>

    <!-- Modal Novo Check-in -->
    <div id="modal-checkin" class="fixed inset-0 bg-black/60 hidden z-[60] flex items-end justify-center">
        <div class="bg-white w-full max-w-md rounded-t-[3rem] p-8 space-y-5 animate-slide-up">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-black italic uppercase">Registrar Treino</h3>
                <button onclick="toggleModal('modal-checkin')" class="text-slate-300"><i class="fas fa-times-circle text-2xl"></i></button>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Atividade</label>
                <select id="checkin-activity" class="w-full p-4 bg-slate-50 rounded-2xl mt-1 outline-none font-bold text-sm border-none"></select>
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase ml-1">Como foi o treino?</label>
                <input id="checkin-caption" type="text" placeholder="Ex: Pago com sucesso! 🔥" class="w-full p-4 bg-slate-50 rounded-2xl mt-1 outline-none text-sm font-medium">
            </div>
            <button onclick="submitCheckin()" class="w-full py-5 bg-rose-500 text-white rounded-2xl font-black uppercase tracking-widest shadow-xl shadow-rose-100 active:scale-95 transition">Postar Check-in</button>
        </div>
    </div>

    <script>
        const METAS = [
            { nome: "Musculação", pontos: 5 }, { nome: "Cardio (30 min)", pontos: 5 },
            { nome: "Cardio (20 min)", pontos: 2 }, { nome: "Beber 2L de Água", pontos: 5 },
            { nome: "Consistência (5 dias)", pontos: 15 }, { nome: "Refeição Saudável", pontos: 3 },
            { nome: "Nova Receita Fit", pontos: 10 }, { nome: "Caminhada (40 min)", pontos: 8 },
            { nome: "Noite de Sono (7h+)", pontos: 5 }, { nome: "Dormir até 10:30 (fds)", pontos: 10 },
            { nome: "Ajudar a mãe", pontos: 5 }, { nome: "Massagem (15 min)", pontos: 20 },
            { nome: "Cardio (+18)", pontos: 10 }, { nome: "Tomar Creatina", pontos: 3 },
            { nome: "Comer Frutas", pontos: 3 }, { nome: "Tratamento H. pylori", pontos: 3000 },
            { nome: "Cirurgia Joelho", pontos: 3000 }
        ];

        const LOJA = [
            { id: 1, name: "Conjunto Academia (Até R$200)", price: 1300, img: "https://images.unsplash.com/photo-1518310383802-640c2de311b2?w=400" },
            { id: 2, name: "Jantar Especial", price: 1600, img: "https://images.unsplash.com/photo-1559339352-11d035aa65de?w=400" },
            { id: 3, name: "Conjunto Academia (Até R$40)", price: 700, img: "https://images.unsplash.com/photo-1556940113-997371d6446e?w=400" },
            { id: 4, name: "Ifood Liberado", price: 850, img: "https://images.unsplash.com/photo-1526367790999-0150786686a2?w=400" },
            { id: 5, name: "Perfume Importado", price: 3400, img: "https://images.unsplash.com/photo-1541643600914-78b084683601?w=400" },
            { id: 6, name: "Vale R$500 Shein", price: 3000, img: "https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=400" }
        ];

        let state = JSON.parse(localStorage.getItem('fit_vitoria_v1')) || { balance: 0, checkins: [] };

        function save() { 
            localStorage.setItem('fit_vitoria_v1', JSON.stringify(state)); 
            render(); 
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active-tab', 'text-slate-400'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            document.getElementById(`nav-${tab}`).classList.add('active-tab');
        }

        function toggleModal(id) { document.getElementById(id).classList.toggle('hidden'); }

        function checkAdmin() {
            if(document.getElementById('admin-pass').value === '271224') {
                document.getElementById('admin-login').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
            } else { alert("Senha incorreta!"); }
        }

        function submitCheckin() {
            const select = document.getElementById('checkin-activity');
            const meta = METAS.find(m => m.nome === select.value);
            state.checkins.unshift({
                id: Date.now(),
                activity: meta.nome,
                points: meta.pontos,
                caption: document.getElementById('checkin-caption').value,
                status: 'Pendente',
                date: new Date().toLocaleDateString('pt-BR')
            });
            document.getElementById('checkin-caption').value = '';
            toggleModal('modal-checkin');
            save();
        }

        function approve(id) {
            const c = state.checkins.find(x => x.id === id);
            if(c && c.status === 'Pendente') {
                c.status = 'Aprovado';
                state.balance += c.points;
                save();
            }
        }

        function render() {
            document.getElementById('balance-display').innerText = state.balance;
            
            // Renderizar Feed
            const feed = document.getElementById('feed-list');
            feed.innerHTML = state.checkins.map(c => `
                <div class="bg-white p-5 rounded-[2rem] card-shadow border border-slate-50">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[9px] font-black text-slate-300 uppercase">${c.date}</span>
                        <span class="px-3 py-1 rounded-full text-[8px] font-black uppercase ${c.status === 'Aprovado' ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                            ${c.status}
                        </span>
                    </div>
                    <h3 class="font-black text-slate-800 uppercase italic leading-none">${c.activity}</h3>
                    <p class="text-xs text-slate-500 mt-2">"${c.caption || 'Sem legenda'}"</p>
                    <div class="mt-4 pt-3 border-t border-slate-50 flex items-center text-rose-500 font-black text-[10px]">
                        <i class="fas fa-plus-circle mr-1"></i> ${c.points} PONTOS
                    </div>
                </div>
            `).join('');

            // Renderizar Admin Approvals
            const adminList = document.getElementById('admin-approvals');
            const pendentes = state.checkins.filter(c => c.status === 'Pendente');
            adminList.innerHTML = pendentes.map(c => `
                <div class="flex justify-between items-center bg-slate-50 p-4 rounded-2xl">
                    <div>
                        <p class="font-bold text-xs">${c.activity}</p>
                        <p class="text-[10px] text-slate-400">+${c.points} pts</p>
                    </div>
                    <button onclick="approve(${c.id})" class="bg-emerald-500 text-white px-4 py-2 rounded-xl text-[10px] font-black uppercase">Aprovar</button>
                </div>
            `).join('') || '<p class="text-center text-[10px] text-slate-300 uppercase py-4">Nenhuma pendência</p>';

            // Renderizar Metas
            document.getElementById('metas-list').innerHTML = METAS.map(m => `
                <div class="flex justify-between items-center bg-white p-4 rounded-2xl card-shadow border border-slate-50">
                    <span class="font-bold text-slate-700 text-xs uppercase tracking-tighter">${m.nome}</span>
                    <span class="bg-rose-50 text-rose-500 px-3 py-1 rounded-lg font-black text-xs">+${m.pontos}</span>
                </div>
            `).join('');

            // Renderizar Loja
            document.getElementById('shop-list').innerHTML = LOJA.map(i => `
                <div class="bg-white p-3 rounded-[2rem] card-shadow flex flex-col h-full">
                    <img src="${i.img}" class="w-full h-24 object-cover rounded-[1.5rem] mb-3">
                    <h4 class="text-[10px] font-black text-slate-800 uppercase leading-tight flex-grow px-1">${i.name}</h4>
                    <div class="flex items-center justify-between mt-3 p-2 bg-slate-50 rounded-xl">
                        <span class="text-rose-600 font-black text-[10px]">${i.price} pts</span>
                        <button class="bg-slate-900 text-white px-2 py-1 rounded-lg text-[8px] font-bold uppercase">Resgatar</button>
                    </div>
                </div>
            `).join('');
        }

        function resetApp() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }

        // Inicialização
        const sel = document.getElementById('checkin-activity');
        METAS.forEach(m => sel.innerHTML += `<option value="${m.nome}">${m.nome} (+${m.pontos} pts)</option>`);
        render();
    </script>
</body>
</html>
